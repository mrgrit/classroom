<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 - Classroom Padlet</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar">
    <h1 class="logo"><a href="/">📌 Classroom Padlet</a></h1>
    <div id="user-area" class="user-area"></div>
  </header>

  <section id="login-view" class="login-view hidden">
    <div class="login-card">
      <h2>구글 계정으로 로그인하세요</h2>
      <div id="google-signin-btn"></div>
      <p id="login-error" class="error hidden"></p>
    </div>
  </section>

  <main id="me-view" class="container hidden">
    <h2 class="section-title">내 정보</h2>

    <section class="me-card" id="profile-card"></section>

    <section class="me-card">
      <h2>🤖 내 AI (Ollama) 설정</h2>
      <p class="hint">자신의 Ollama 서버를 연결해 두면 보드 컬럼의 기록으로 개인 학습자료(PDF)를 만들 수 있습니다.</p>
      <div class="ai-form">
        <label>Ollama 서버 주소
          <input type="text" id="ai-url" placeholder="예: 192.168.0.10:11434 또는 http://내서버:11434" maxlength="200">
        </label>
        <button id="ai-connect" class="btn">연결</button>
      </div>
      <p id="ai-connect-status" class="hint"></p>
      <div class="ai-form">
        <label>AI 모델 선택
          <select id="ai-model" disabled><option value="">먼저 서버에 연결하세요</option></select>
        </label>
        <button id="ai-save" class="btn btn-primary" disabled>저장</button>
      </div>
      <p id="ai-save-status" class="hint"></p>
    </section>

    <section class="me-card">
      <h2>📚 내 AI 학습자료</h2>
      <div id="report-list"></div>
      <p id="empty-reports" class="empty hidden">아직 만든 학습자료가 없습니다. 보드의 컬럼에서 🤖 버튼을 눌러 만들어보세요.</p>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/me.js"></script>
</body>
</html>
