<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>참가 - Classroom Kahoot</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="stage">
  <header class="topbar">
    <h1 class="logo"><a href="/">🎯 Classroom Kahoot</a></h1>
    <div id="user-area" class="user-area"></div>
  </header>

  <section id="login-view" class="login-view hidden">
    <div class="login-card">
      <h2>구글 계정으로 로그인하세요</h2>
      <p>로그인하면 바로 게임에 참가합니다.</p>
      <div id="google-signin-btn"></div>
      <p id="login-error" class="error hidden"></p>
    </div>
  </section>

  <main id="play-view" class="play-main hidden">
    <div class="stage-bar">
      <span id="bar-left"></span>
      <span id="bar-right" class="score-box"></span>
    </div>
    <div id="stage" class="stage-center"></div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
