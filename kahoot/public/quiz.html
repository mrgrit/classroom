<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀴즈 편집 - Classroom Kahoot</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar">
    <h1 class="logo"><a href="/">🎯 Classroom Kahoot</a></h1>
    <div id="user-area" class="user-area"></div>
  </header>

  <section id="login-view" class="login-view hidden">
    <div class="login-card">
      <h2>구글 계정으로 로그인하세요</h2>
      <div id="google-signin-btn"></div>
      <p id="login-error" class="error hidden"></p>
    </div>
  </section>

  <main id="editor-view" class="container hidden">
    <div class="editor-head">
      <input type="text" id="quiz-title" placeholder="퀴즈 제목" maxlength="100">
      <input type="text" id="quiz-desc" placeholder="설명 (선택)" maxlength="300">
    </div>
    <div class="editor-toolbar">
      <button id="add-question" class="btn">＋ 문제 추가</button>
      <button id="bulk-import" class="btn">📋 텍스트로 한번에 입력</button>
      <span class="spacer"></span>
      <span id="save-state" class="save-state"></span>
      <button id="save" class="btn btn-primary">저장</button>
      <button id="host" class="btn">▶ 게임 시작</button>
    </div>
    <div id="questions"></div>
    <p id="empty-questions" class="empty hidden">문제가 없습니다. "문제 추가" 또는 "텍스트로 한번에 입력"을 눌러 시작하세요.</p>
  </main>

  <div id="bulk-modal" class="modal-bg hidden">
    <div class="modal">
      <h3>텍스트로 한번에 입력</h3>
      <p>문제 하나당 첫 줄은 문제, 다음 줄부터 보기입니다. 정답 보기 앞에 <b>*</b>를 붙이고, 문제 사이는 빈 줄로 구분합니다. 기존 문제 뒤에 추가됩니다.</p>
      <pre>대한민국의 수도는?
*서울
부산
대구
인천

1 + 1 = ?
1
*2
3</pre>
      <textarea id="bulk-text" placeholder="여기에 붙여넣기"></textarea>
      <div class="modal-actions">
        <button id="bulk-cancel" class="btn">취소</button>
        <button id="bulk-ok" class="btn btn-primary">추가</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/quiz.js"></script>
</body>
</html>
