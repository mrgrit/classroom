<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 학습자료 - Classroom Padlet</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar">
    <h1 class="logo"><a href="/">📌 Classroom Padlet</a></h1>
    <div id="user-area" class="user-area"></div>
  </header>

  <section id="login-view" class="login-view hidden">
    <div class="login-card">
      <h2>구글 계정으로 로그인하세요</h2>
      <div id="google-signin-btn"></div>
      <p id="login-error" class="error hidden"></p>
    </div>
  </section>

  <main id="report-view" class="report-page hidden">
    <div class="report-head-line">
      <div>
        <h2 id="report-title"></h2>
        <p id="report-meta" class="hint"></p>
      </div>
      <div class="report-actions">
        <a class="btn btn-small" href="/me">📚 내 학습자료</a>
        <a class="btn btn-small btn-primary" id="report-pdf" href="#">⬇ PDF 다운로드</a>
        <button class="btn btn-small btn-danger" id="report-delete">삭제</button>
      </div>
    </div>
    <article id="report-body" class="report-body"></article>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
