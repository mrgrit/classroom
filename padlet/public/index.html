<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Padlet</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar">
    <h1 class="logo">📌 Classroom Padlet</h1>
    <div id="user-area" class="user-area"></div>
  </header>

  <!-- 로그인 화면 -->
  <section id="login-view" class="login-view hidden">
    <div class="login-card">
      <h2>구글 계정으로 로그인하세요</h2>
      <p>학교 구글 계정으로 로그인하면 보드에 참여할 수 있습니다.</p>
      <div id="google-signin-btn"></div>
      <p id="login-error" class="error hidden"></p>
    </div>
  </section>

  <!-- 보드 목록 화면 -->
  <main id="boards-view" class="container hidden">
    <div id="admin-panel" class="admin-panel hidden">
      <h2>새 보드 만들기</h2>
      <form id="board-form" class="board-form">
        <input type="text" id="board-title" placeholder="보드 제목 (예: 1교시 - 오늘 배운 것 한 줄 정리)" maxlength="100" required>
        <input type="text" id="board-desc" placeholder="설명 (선택)" maxlength="200">
        <input type="text" id="board-columns" placeholder="컬럼 (쉼표로 구분, 예: 1조, 2조, 3조 / 비우면 컬럼 1개)" maxlength="300">
        <button type="submit" class="btn btn-primary">보드 만들기</button>
      </form>
    </div>
    <h2 class="section-title">보드 목록</h2>
    <div id="board-list" class="board-list"></div>
    <p id="empty-boards" class="empty hidden">아직 보드가 없습니다. 선생님이 보드를 만들면 여기에 표시됩니다.</p>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
